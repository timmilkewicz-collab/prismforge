name: Windows build

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  native-and-control:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control/ui/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare pinned vcpkg registry
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'prismforge-vcpkg'
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout 00be06124721b0fa2fb451982e707f81b3b06e5a
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build native runtime
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_ROOT 'scripts\buildsystems\vcpkg.cmake'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain"
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Compile every scene and quality tier
        shell: pwsh
        run: ./tests/compile-shaders.ps1
      - name: Build local control surface
        shell: pwsh
        run: |
          cd control/ui
          npm ci
          npm run test
          npm run build
          cd ..
          dotnet build PrismForge.Control/PrismForge.Control.csproj -c Release
          dotnet test PrismForge.Control.Tests/PrismForge.Control.Tests.csproj -c Release
